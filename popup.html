<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto Form Filler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 180px;
      padding: 16px 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* Animated Checkmark Icon */
    .icon-container {
      width: 36px;
      height: 36px;
      background: rgba(34, 197, 94, 0.2);
      border: 2px solid #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .icon-container svg {
      width: 20px;
      height: 20px;
      stroke: #22c55e;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .status-text {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #f8fafc;
    }

    /* Subtitle countdown indicator */
    .timer-text {
      font-size: 10px;
      color: #94a3b8;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-container">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <span class="status-text">Data Filled!</span>
    <span class="timer-text" id="timer">Closing...</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
